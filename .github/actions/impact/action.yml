name: Reqover impact analysis
description: Analyse retest candidates and render an offline report. Requires Java 17+, Bash, Git, curl and Python 3.

inputs:
  report:
    description: Recorded report JSON. Recording with the agent/starter happens before this Action.
    required: false
    default: build/reqover-report.json
  version:
    description: CLI release to download, without the leading v. Ignored when cli-jar is supplied.
    required: false
    default: "0.4.1"
  cli-jar:
    description: Optional path to an existing source-built CLI JAR, for unreleased report features.
    required: false
    default: ""
  base-ref:
    description: Git ref to diff against. Defaults to the PR base; required outside pull requests.
    required: false
    default: ""
  fail-on-impact:
    description: Fail after publishing results if observed APIs execute changed code. Not a test-failure gate.
    required: false
    default: "false"
  comment:
    description: Update a marked PR comment. Requires pull-requests write; fork PRs are skipped.
    required: false
    default: "true"
  upload-artifact:
    description: Opt in to upload the three result files; use distinct artifact-name values for matrix jobs or repeated calls.
    required: false
    default: "false"
  artifact-name:
    description: Artifact name. Use a unique value for each matrix job or Action invocation.
    required: false
    default: reqover-report
  analysis-name:
    description: Names this analysis in its PR comment marker, so several analyses in one PR (a matrix, several services) each keep their own comment. Letters, digits, '.', '_' and '-'.
    required: false
    default: ""

outputs:
  markdown:
    description: Analysis as Markdown.
    value: ${{ steps.analyse.outputs.markdown }}
  has-impact:
    description: "true when observed endpoints execute changed code; false does not prove safety."
    value: ${{ steps.analyse.outputs.has-impact }}
  impacted-endpoint-count:
    description: Number of observed endpoint retest candidates.
    value: ${{ steps.analyse.outputs.impacted-endpoint-count }}
  unmatched-path-count:
    description: Changed paths without observed coverage, including non-source files.
    value: ${{ steps.analyse.outputs.unmatched-path-count }}
  html-path:
    description: Absolute path to the standalone report on this runner.
    value: ${{ steps.analyse.outputs.html-path }}
  json-path:
    description: Absolute path to the impact JSON on this runner.
    value: ${{ steps.analyse.outputs.json-path }}
  markdown-path:
    description: Absolute path to the impact Markdown on this runner.
    value: ${{ steps.analyse.outputs.markdown-path }}
  artifact-url:
    description: Uploaded artifact URL, or empty when artifact upload is disabled.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Analyse and render the recorded report
      id: analyse
      shell: bash
      env:
        REPORT: ${{ inputs.report }}
        ANALYSIS_NAME: ${{ inputs.analysis-name }}
        CLI_JAR: ${{ inputs.cli-jar }}
        REQOVER_VERSION: ${{ inputs.version }}
        BASE_REF: ${{ inputs.base-ref }}
        PR_BASE: ${{ github.base_ref }}
      run: bash "${GITHUB_ACTION_PATH}/analyse.sh"

    - name: Upload diagnostic artifacts
      id: upload
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.analyse.outputs.html-path }}
          ${{ steps.analyse.outputs.markdown-path }}
          ${{ steps.analyse.outputs.json-path }}
        if-no-files-found: error
        retention-days: 7

    - name: Comment on the pull request
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        MARKDOWN: ${{ steps.analyse.outputs.markdown-path }}
        MARKER: ${{ steps.analyse.outputs.comment-marker }}
      run: |
        set -euo pipefail
        # --jq runs per page with --paginate; gh rejects it together with --slurp.
        comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
          --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.MARKER))) | .id' | tail -n 1)"
        if [ -n "${comment_id}" ]; then
          gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" --field "body=@${MARKDOWN}" > /dev/null
        else
          gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --field "body=@${MARKDOWN}" > /dev/null
        fi

    - name: Apply the optional impact gate
      shell: bash
      env:
        FAIL_ON_IMPACT: ${{ inputs.fail-on-impact }}
        HAS_IMPACT: ${{ steps.analyse.outputs.has-impact }}
      run: |
        if [ "${FAIL_ON_IMPACT}" = "true" ] && [ "${HAS_IMPACT}" = "true" ]; then
          echo "::error::Observed APIs execute changed code. Review the saved retest candidates."
          exit 1
        fi
