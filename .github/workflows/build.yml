name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and test
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Generate CycloneDX SBOM
        if: matrix.java == 21
        run: |
          ./gradlew cyclonedxBom --no-daemon --console=plain
          ./scripts/verify-sbom-lock.py build/reports/bom/reqover.cdx.json sbom/reqover.cdx.json

      - name: Resolve project version
        if: matrix.java == 21
        run: |
          project_version="$(./gradlew properties -q --no-daemon --console=plain | sed -n 's/^version: //p')"
          test -n "${project_version}"
          echo "PROJECT_VERSION=${project_version}" >> "${GITHUB_ENV}"

      - name: Verify release metadata in agent JAR
        if: matrix.java == 21
        run: |
          jar tf "reqover-agent/build/libs/reqover-agent-${PROJECT_VERSION}.jar" > jar-entries.txt
          grep -Fx 'META-INF/LICENSE-REQOVER' jar-entries.txt
          grep -Fx 'META-INF/NOTICE-REQOVER' jar-entries.txt
          grep -Fx 'META-INF/THIRD_PARTY_NOTICES.md' jar-entries.txt
          grep -Fx 'META-INF/LICENSE-ASM' jar-entries.txt

      - name: Upload SBOM
        if: matrix.java == 21
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reqover-sbom
          path: build/reports/bom/reqover.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Java agent
        if: matrix.java == 21
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reqover-agent
          path: reqover-agent/build/libs/reqover-agent-${{ env.PROJECT_VERSION }}.jar
          if-no-files-found: error
          retention-days: 14

  impact-pipeline:
    name: report export and impact analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Exercises the loop the CLI exists for: record traffic, export a report
      # on shutdown, then name the endpoints a source change would affect. The
      # script fails if the analysis does not find the endpoint it should.
      - name: Record, export, and analyse
        run: ./scripts/run-impact-demo.sh 18080

      - name: Upload the recorded report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reqover-demo-report
          path: |
            build/reqover-impact-demo/report.json
            build/reqover-impact-demo/report.html
          if-no-files-found: error
          retention-days: 14

  osv:
    name: OSV dependency scan
    needs: verify
    permissions:
      actions: read
      contents: read
      # The pinned reusable workflow declares this permission even when SARIF upload is disabled.
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      download-artifact: reqover-sbom
      scan-args: |-
        --sbom=reqover.cdx.json
      upload-sarif: false
      fail-on-vuln: true
