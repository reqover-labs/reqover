name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Generate SBOM
        run: ./gradlew cyclonedxBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: reqover-sbom
          path: build/reports/bom/reqover-sbom.json
