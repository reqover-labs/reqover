# Known-vulnerability exceptions for the OSV gate (build.yml and
# scripts/check-sbom-osv.py). Every entry needs a reason, why no fix can be
# taken today, and an expiry; the gate fails again once ignoreUntil passes.
# Policy: SECURITY.md, "Dependency advisories".

[[IgnoredVulns]]
id = "GHSA-9qf2-26p9-2q2q" # CVE-2026-47892, WebFlux functional header predicate bypass
ignoreUntil = 2026-11-12T00:00:00Z
reason = """
Reviewed 2026-10-12 against https://spring.io/security/cve-2026-47892/.
Spring 6.2.19 has no usable OSS fix in the Boot 3.5 line: 6.2.20 is enterprise
support only and the OSS fix is 7.0.9. Mixing Spring 7 into Boot 3.5 is not a
compatible patch. The WebFlux sample uses the reactive Netty server, not
DispatcherServlet; Reqover report routes are restricted to REACTIVE apps and
do not use header predicates. Published adapters declare Spring compileOnly
and do not ship Spring classes. This is a temporary sample/test risk exception,
not a fix or a claim about consumer apps. Re-review by 2026-11-12; the source
scope and SBOM version are guarded by scripts/test-osv-policy.py.
"""

[[IgnoredVulns]]
