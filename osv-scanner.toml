ignoreUntil = 2026-11-12T00:00:00Z
reason = """
Reviewed 2026-10-12 against https://spring.io/security/cve-2026-47890/.
Spring 6.2.19 has no usable OSS fix in the Boot 3.5 line: 6.2.20 is enterprise
support only and the OSS fix is 7.0.9. Mixing Spring 7 into Boot 3.5 is not a
compatible patch. The MVC/WebFlux samples and report routes do not render
view fragments over SSE; they return JSON/plain text or complete static HTML.
Published adapters declare Spring compileOnly and do not ship Spring classes.
This is a temporary sample/test risk exception, not a fix or a claim about
consumer apps. Re-review by 2026-11-12; the source scope and SBOM version are
guarded by scripts/test-osv-policy.py.
"""

[[IgnoredVulns]]
id = "GHSA-pc63-qcmh-9cmg" # CVE-2026-47884, spring-webmvc XsltView path limitation
ignoreUntil = 2026-12-31T00:00:00Z
reason = """
No open-source fix exists for Spring Framework 6.2.x: OSV lists 6.2.19 (the
latest 6.2 release, brought in by Spring Boot 3.5.16) as last affected, and
the only fixed line is 7.0.9 (Spring Boot 4). Reqover's published modules
declare spring-webmvc compileOnly, so they ship no Spring and users run their
own version; the affected copy is in the MVC sample and test runtimes only,
neither of which uses XsltView. Revisit when Spring Boot 3.5 gets a fixed
Framework release or the samples move to Spring Boot 4.
"""
